name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo test --workspace
      - run: cargo run -p hyperdeck-plugin --bin typegen
      - run: npm ci
        working-directory: pi
      - run: npm run build
        working-directory: pi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p hyperdeck-plugin --release --bin plugin --target ${{ matrix.target }}
